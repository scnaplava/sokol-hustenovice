# Nasazení webu na GitHub Pages.
#
# Data z IS FAČR stahuje server v Česku (viz server/setup.sh) – IS FAČR
# neodpovídá serverům GitHubu v zahraničí. Server každých 15 minut nahraje
# změněná data do repozitáře a tento workflow web znovu nasadí.
name: Nasazení webu

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
